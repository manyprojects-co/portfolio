########################  ABOUT  ########################

content:
  - name: about
    label: About
    type: file
    path: content/about.md
    fields:
      - { name: bio, label: Bio, type: rich-text }
      - { name: exhibitionsAppearances, label: Exhibitions & Appearances, type: rich-text }
      - { name: awardsCommissions, label: Awards & Commissions, type: rich-text }
      - { name: pressMentions, label: Press & Mentions, type: rich-text }
      - { name: image, label: Profile Image, type: image }

########################  CONTACT  ########################

  - name: contact
    label: Contact
    type: file
    path: content/contact.md
    fields:
      - { name: email, label: Email Address, type: string }
      - { name: instagram, label: Instagram URL, type: string }

########################  ARTWORK  ########################

  - name: artworks
    label: Artworks
    type: collection
    path: content/artworks
    view:
      fields: [featureOrder, title, productionDate, tagline, medium, size, duration, premiereCity, exhibitions, artistStatement, acknowledgements]
    fields:
      # Title, Date, Art Tagline
      - { name: title, label: Title, type: string, required: true }
      - { name: productionDate, label: Production Date, type: date }
      - { name: tagline, label: Art Tagline, type: string }

      # Medium, Size, Duration
      - { name: medium, label: Medium, type: string }
      - { name: size, label: Size, type: string }
      - { name: duration, label: Duration, type: string }

      # Operational / Display Settings
      - { name: featured, label: Featured on Front Page?, type: boolean }
      - { name: featureOrder, label: Feature Order, type: number }

      # Premiere City, Exhibitions, Artist Statement, Acknowledgements
      - { name: premiereCity, label: Premiere City, type: string }
      - { name: exhibitions, label: Exhibitions, type: rich-text }
      - { name: artistStatement, label: Artist Statement, type: rich-text }
      - { name: acknowledgements, label: Acknowledgements, type: rich-text }

  # Single Key Visuals (100% Cloudflare Hosted)
      - name: landingVisual
        label: Landing Visual (Rectangle)
        type: object
        fields:
          - name: mediaType
            label: Media Type
            type: select
            options:
              values: [image, video]
          - { name: imageUrl, label: Cloudflare Image URL, type: string }
          - { name: videoUrl, label: Cloudflare Video URL, type: string }

      - name: tabArtVisual
        label: Tab-Art Visual (Site-specific)
        type: object
        fields:
          - name: mediaType
            label: Media Type
            type: select
            options:
              values: [image, video]
          - { name: imageUrl, label: Cloudflare Image URL, type: string }
          - { name: videoUrl, label: Cloudflare Video URL, type: string }

      - name: cardCoverVisual
        label: Card-Cover Visual (16:9/narrow)
        type: object
        fields:
          - name: mediaType
            label: Media Type
            type: select
            options:
              values: [image, video]
          - { name: imageUrl, label: Cloudflare Image URL, type: string }
          - { name: videoUrl, label: Cloudflare Video URL, type: string }

      # Art Gallery (100% Cloudflare Hosted)
      - name: cardGallery
        label: Art Gallery
        type: object
        list: true
        fields:
          - name: mediaType
            label: Media Type
            type: select
            options:
              values: [image, video]
          - { name: imageUrl, label: Cloudflare Image URL, type: string }
          - { name: videoUrl, label: Cloudflare Video URL, type: string }
          - { name: caption, label: Caption, type: string }

      # Technical Tagline & Text
      - { name: technicalTagline, label: Technical Tagline, type: string }
      - { name: technicalText, label: Technical Text, type: rich-text }

      # Technical Gallery (100% Cloudflare Hosted)
      - name: technicalGallery
        label: Technical Gallery
        type: object
        list: true
        fields:
          - name: mediaType
            label: Media Type
            type: select
            options:
              values: [image, video]
          - { name: imageUrl, label: Cloudflare Image URL, type: string }
          - { name: videoUrl, label: Cloudflare Video URL, type: string }
          - { name: caption, label: Caption, type: string }

########################  NEWS  ########################

  - name: news
    label: News
    type: collection
    path: content/news
    view:
      fields: [title, date, endDate, location, city, eventType]
    fields:
      - { name: title, label: Title, type: string, required: true }
      - { name: subheading, label: Subheading, type: string }
      - { name: isDateRange, label: Date Range?, type: boolean, default: false }
      - { name: date, label: Date / Start Date, type: date }
      - { name: endDate, label: End Date, type: date }
      - { name: location, label: Location, type: string }
      - { name: city, label: City, type: string }
      - name: eventType
        label: Event Type
        type: select
        options:
          values: [Award, Screening, Solo exhibition, Group exhibition, Artist Talk, Press]
      - { name: statement, label: Statement, type: rich-text }

      # Main News Visual (100% Cloudflare Hosted)
      - name: mainVisual
        label: Main Cover Visual
        type: object
        fields:
          - name: mediaType
            label: Media Type
            type: select
            options:
              values: [image, video]
          - { name: imageUrl, label: Cloudflare Image URL, type: string }
          - { name: videoUrl, label: Cloudflare Video URL, type: string }

      # News Gallery (100% Cloudflare Hosted)
      - name: gallery
        label: News Gallery
        type: object
        list: true
        fields:
          - name: mediaType
            label: Media Type
            type: select
            options:
              values: [image, video]
          - { name: imageUrl, label: Cloudflare Image URL, type: string }
          - { name: videoUrl, label: Cloudflare Video URL, type: string }
          - { name: caption, label: Caption, type: string }