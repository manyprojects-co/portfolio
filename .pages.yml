########################  ABOUT  ########################

content:
  - name: about
    label: About
    type: file
    path: content/about.md
    fields:
      - { name: bio, label: Bio, type: rich-text }
      - { name: exhibitionsAppearances, label: Exhibitions & Appearances, type: rich-text }
      - { name: awardsCommissions, label: Awards & Commissions, type: rich-text }
      - { name: pressMentions, label: Press & Mentions, type: rich-text }
      - { name: mediaUrl, label: Profile Picture (Cloudflare URL), type: string }
      - { name: faviconUrl, label: Favicon (Cloudflare URL — square PNG or SVG), type: string }

########################  CONTACT  ########################

  - name: contact
    label: Contact
    type: file
    path: content/contact.md
    fields:
      - { name: email, label: Email Address, type: string }
      - { name: instagram, label: Instagram URL, type: string }

########################  ARTWORK  ########################

  - name: artworks
    label: Artworks
    type: collection
    path: content/artworks
    view:
      fields: [featureOrder, title, productionDate, tagline, medium, size, duration, premiereCity, exhibitions, artistStatement, institutionSupport]
    fields:
      # Title, Date, Art Tagline
      - { name: title, label: Title, type: string, required: true }
      - { name: productionDate, label: Production Date, type: date }
      # ⚠︎ key stays `tagline` (11/11 files carry it); only the LABEL changed on 2026-09-30.
      # Renders under the title in the ART grid (replaced premiereCity) and as the page description.
      - { name: tagline, label: Work Type (short — under the title in the ART grid), type: string }

      # Medium (the full technical line, on the card), Size, Duration
      - { name: medium, label: Medium, type: string }
      - { name: size, label: Size, type: string }
      - { name: duration, label: Duration, type: string }

      # Operational / Display Settings
      - { name: featured, label: Featured on Front Page?, type: boolean }
      - { name: featureOrder, label: Feature Order, type: number }

      # Premiere City, Exhibitions, Artist Statement, Acknowledgements
      - { name: premiereCity, label: Premiere City, type: string }
      - { name: exhibitions, label: Exhibitions, type: rich-text }
      - { name: artistStatement, label: Artist Statement (and acknowledgements), type: rich-text }
      - { name: institutionSupport, label: Institution Support, type: rich-text }

  # Single Key Visuals (100% Cloudflare Hosted)
      - name: landingVisual
        label: Landing Visual (Rectangle)
        type: object
        fields:
          - name: mediaType
            label: Media Type
            type: select
            options:
              values: [image, video]
          - { name: mediaUrl, label: Cloudflare Media URL, type: string }

      - name: tabArtVisual
        label: Tab-Art Visual (Site-specific)
        type: object
        fields:
          - name: mediaType
            label: Media Type
            type: select
            options:
              values: [image, video]
          - { name: mediaUrl, label: Cloudflare Media URL, type: string }

      - name: cardCoverVisual
        label: Card-Cover Visual (16:9/narrow)
        type: object
        fields:
          - name: mediaType
            label: Media Type
            type: select
            options:
              values: [image, video]
          - { name: mediaUrl, label: Cloudflare Media URL, type: string }

      # ⭐ MOBILE COVER (2026-10-27, JJ). Shown INSTEAD of cardCoverVisual wherever the card is
      # single-column (≤812px: phones and small tablets), where the cover is full-bleed and
      # portrait, 5:6 (5 wide, 6 high — export 1000×1200), capped at 60% of the screen height
      # (cropped from the top). Optional: when empty, the 16:9 cover is centre-cropped to the
      # same box, which keeps under half of its width.
      # ⭐ NAMING CONVENTION: same URL as the card cover with `m` in front of `card` —
      #   …/box-body/bb-card.jpg  →  …/box-body/bb-mcard.jpg
      #   …/xin-1.0.36/xin1-card.jpg  →  …/xin-1.0.36/xin1-mcard.jpg
      # `npm run data:report` flags a mobile URL that does not follow it.
      - name: cardCoverMobileVisual
        label: Card-Cover Visual, MOBILE (5:6 portrait, 1000×1200 — same URL as the card cover, "-card" → "-mcard")
        type: object
        fields:
          - name: mediaType
            label: Media Type
            type: select
            options:
              values: [image, video]
          - { name: mediaUrl, label: Cloudflare Media URL (…/<slug>-mcard.jpg), type: string }

  # Art Gallery (Intersperse Images, Videos, & Text)
      - name: cardGallery
        label: Art Gallery
        type: object
        list: true
        fields:
          - name: mediaType
            label: Media Type
            type: select
            options:
              values: [image, video, text]
          - { name: mediaUrl, label: Cloudflare Media URL, type: string }
          - { name: caption, label: Image/Video Caption, type: string }
          - { name: textContent, label: Text Block Content, type: rich-text }

      # Technical Text
      - { name: technicalText, label: Technical Text, type: rich-text }

      # Technical Gallery (Intersperse Images, Videos, & Text)
      - name: technicalGallery
        label: Technical Gallery
        type: object
        list: true
        fields:
          - name: mediaType
            label: Media Type
            type: select
            options:
              values: [image, video, text]
          - { name: mediaUrl, label: Cloudflare Media URL, type: string }
          - { name: caption, label: Image/Video Caption, type: string }
          - { name: textContent, label: Text Block Content, type: rich-text }

########################  NEWS  ########################

  - name: news
    label: News
    type: collection
    path: content/news
    view:
      fields: [title, date, endDate, location, city, eventType]
    fields:
      - { name: title, label: Title, type: string, required: true }
      - { name: subheading, label: Subheading (180 cha ideal), type: rich-text }
      - { name: isDateRange, label: Date Range?, type: boolean, default: false }
      - { name: date, label: Date / Start Date, type: date }
      - { name: endDate, label: End Date, type: date }
      - { name: location, label: Location, type: string }
      - { name: city, label: City, type: string }
      - name: eventType
        label: Event Type
        type: select
        options:
          values: [Award, Screening, Solo exhibition, Group exhibition, Artist Talk, Press, Commission]

      # Main News Visual
      - name: mainVisual
        label: Main Cover Visual
        type: object
        fields:
          - name: mediaType
            label: Media Type
            type: select
            options:
              values: [image, video]
          - { name: mediaUrl, label: Cloudflare Media URL, type: string }

      # News Gallery (Intersperse Images, Videos, & Text)
      - name: gallery
        label: News Gallery
        type: object
        list: true
        fields:
          - name: mediaType
            label: Media Type
            type: select
            options:
              values: [image, video, text]
          - { name: mediaUrl, label: Cloudflare Media URL, type: string }
          - { name: caption, label: Image/Video Caption, type: string }
          - { name: textContent, label: Text Block Content, type: rich-text }